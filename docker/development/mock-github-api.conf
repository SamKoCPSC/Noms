server {
    listen 8080;
    server_name _;

    location = /isalive {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /github/userinfo {
        default_type application/json;
        return 200 '{"id":424242,"login":"noms-local-github","avatar_url":null}';
    }

    location = /github/emails {
        default_type application/json;
        return 200 '[{"email":"noms-local-github@example.test","primary":true,"verified":true}]';
    }

    location / {
        return 404;
    }
}
