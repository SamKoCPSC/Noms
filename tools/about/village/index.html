<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noms — Village layout study</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#332b23;background:#d8e5e5;overflow:hidden}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;top:16px;left:20px;pointer-events:none}h1{margin:0;font:600 25px Georgia,serif}header p{margin:6px 0;font-size:13px;max-width:340px}.panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 28px));padding:16px 20px;border-radius:22px;background:#faf7eff0;box-shadow:0 6px 25px #28302722}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{border:1px solid #ccc6b9;border-radius:18px;background:#fffdf7;padding:9px 13px;color:inherit;font:inherit;font-size:13px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #b95831}button:disabled{opacity:.4}#play{background:#526549;color:white}#title{font-weight:650;flex:1}input{width:100%;accent-color:#ad613d;margin:12px 0 4px}small{font-size:11px;color:#6f7065}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#f4f0e8;z-index:3}#loading p{max-width:330px;padding:10px}#loading[hidden]{display:none}#error{color:#9a362c}.badge{position:absolute;right:18px;top:18px;padding:8px 12px;border-radius:20px;background:#fff9;font-size:11px}@media(max-width:600px){header{top:12px;left:14px}h1{font-size:21px}header p{font-size:11px;max-width:220px}.badge{display:none}.panel{padding:12px}button,select{padding:8px 10px}#title{width:100%;flex:auto;font-size:14px}}
</style>
<canvas aria-label="Interactive terraced village with twelve Noms locations"></canvas>
<header><h1>Noms · The corner village</h1><p>An outdoor walk through twelve places.<br>Drag to look around · scroll to zoom.</p></header>
<div class="badge">Layout & camera prototype · existing lighting</div>
<div id="loading" role="status"><h2>Preparing the village</h2><p id="status">Loading the twelve places…</p><p id="error"></p><button id="retry" hidden>Try again</button></div>
<div class="panel"><div class="row"><span id="title">Village overview</span><button id="overview">Overview</button><button id="play">Walk tour</button><button id="previous" aria-label="Previous stop">←</button><button id="next" aria-label="Next stop">→</button><select id="stops" aria-label="Choose a location"></select></div><input id="progress" aria-label="Tour position" type="range" min="0" max="11" step="0.001" value="0"><small id="hint">Follow the paths at walking height. Overview shows the whole village.</small></div>
<script type="module" src="preview.js"></script></html>
