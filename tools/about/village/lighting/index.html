<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noms · Kitchen daylight study</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#dce8dc;color:#332b23;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh}header{position:absolute;top:16px;left:18px;pointer-events:none}h1{font:600 25px Georgia,serif;margin:0}header p{font-size:12px;margin:6px 0}.panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(650px,calc(100% - 24px));padding:16px;border-radius:22px;background:#faf7eff5;box-shadow:0 6px 25px #28302722}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{font:inherit;font-size:13px;padding:10px 14px;border:1px solid #c9c2b4;background:#fffdf8;border-radius:18px;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#526549;color:white;border-color:#526549}button:focus-visible,select:focus-visible{outline:3px solid #b95831}small{display:block;font-size:12px;margin-top:10px;line-height:1.4;color:#646456}#loading{position:absolute;inset:0;display:grid;place-content:center;background:#f4f0e8;text-align:center;z-index:5;padding:24px}#loading[hidden]{display:none}#loading p{max-width:340px}#error{color:#9a362c}#retry[hidden]{display:none}@media(max-width:600px){header{top:12px;left:14px}h1{font-size:20px}.panel{padding:12px;bottom:12px}button,select{padding:9px 11px;font-size:12px}small{font-size:11px}}
</style>
<canvas aria-label="Kitchen and landscape lighting comparison"></canvas>
<header><h1>Noms · Shared daylight</h1><p>Kitchen district study · drag to look around</p></header>
<div class="panel"><div class="row" role="group" aria-label="Lighting comparison"><button id="before" aria-pressed="false">Current lighting</button><button id="after" aria-pressed="true">Shared sunlight</button><select id="view" aria-label="Camera view"><option value="arrival">Walking camera</option><option value="path">Path & cottage</option><option value="wide">District overview</option></select><button id="walk">Walk a little</button></div><small id="caption">One sun and sky; baked shadows connect the kitchen to its surroundings.</small></div>
<div id="loading" role="status"><h2>Preparing the kitchen</h2><p id="status">Loading the lighting comparison…</p><p id="error"></p><button id="retry" hidden>Try again</button></div>
<script type="module" src="viewer.js"></script></html>
