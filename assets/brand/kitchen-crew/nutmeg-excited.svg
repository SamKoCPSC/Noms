  36.81818182% { animation-timing-function: ease; transform: translateY(1.84px) scale(1.035, 0.97); }
  40.09090909% { animation-timing-function: ease; transform: translateY(0px) scale(1); }
  100.00000000% { animation-timing-function: ease; transform: translateY(0px) scale(1); }
}
