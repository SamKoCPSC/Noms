<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 672" width="512" height="672" role="img" aria-labelledby="nutmeg-excited-title nutmeg-excited-desc" id="nutmeg-excited" data-duration-ms="6600">
<title id="nutmeg-excited-title">Nutmeg — excited jump and wave</title>
<desc id="nutmeg-excited-desc">Nutmeg does two excited hops, waves, and settles into the original resting pose. The animation plays once in 6.6 seconds. Reduced motion shows the resting pose. Transparent, editable vector artwork with no scripts or external resources.</desc>
