@media (prefers-reduced-motion: reduce) {
.nutmeg-excited-jump,
.nutmeg-excited-shadow,
.nutmeg-excited-head-motion,
.nutmeg-excited-left-motion,
.nutmeg-excited-right-motion,
.nutmeg-excited-hat-motion,
.nutmeg-excited-eyes-rest,
.nutmeg-excited-eyes-happy,
