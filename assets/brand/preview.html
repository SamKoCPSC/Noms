<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOMS S3 — SVG review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #e8e2d6; color: #293a2b; font: 16px system-ui, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 0 0 24px; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 24px; max-width: 700px; }
  section { padding: 24px; border-radius: 24px; background: #f5efe2; }
  section.dark { background: #26342d; color: #f5efe2; }
  h2 { font-size: 16px; margin: 0 0 16px; }
  .hero { display: block; height: 320px; width: 256px; margin: auto; }
  .sizes { display: flex; align-items: end; justify-content: space-around; gap: 12px; margin-top: 20px; }
  figure { margin: 0; text-align: center; }
  figure img { display: block; margin: 0 auto 8px; width: auto; }
  figcaption { font-size: 12px; opacity: .75; }
</style>
<h1>NOMS · S3 vector logo</h1>
<p>Continuous olive spine · Fredoka SemiBold · transparent background</p>
<main>
  <section><h2>Light surface</h2><img class="hero" src="noms-logo.svg" alt="NOMS olive book logo">
    <div class="sizes">
      <figure><img src="noms-logo.svg" height="32" alt=""><figcaption>32px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="48" alt=""><figcaption>48px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="64" alt=""><figcaption>64px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="96" alt=""><figcaption>96px</figcaption></figure>
    </div>
  </section>
  <section class="dark"><h2>Dark surface</h2><img class="hero" src="noms-logo.svg" alt="NOMS olive book logo on dark background">
    <div class="sizes">
      <figure><img src="noms-logo.svg" height="32" alt=""><figcaption>32px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="48" alt=""><figcaption>48px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="64" alt=""><figcaption>64px</figcaption></figure>
      <figure><img src="noms-logo.svg" height="96" alt=""><figcaption>96px</figcaption></figure>
    </div>
  </section>
</main>
</html>
