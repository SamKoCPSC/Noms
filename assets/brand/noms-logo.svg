    <linearGradient id="noms-s3-cover" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#858345"/><stop offset=".28" stop-color="#575f32"/><stop offset=".7" stop-color="#414c2b"/><stop offset="1" stop-color="#303d26"/>
    </linearGradient>
    <linearGradient id="noms-s3-spine">
