      <stop stop-color="#a63c2b"/><stop offset=".35" stop-color="#f17450"/><stop offset="1" stop-color="#cf4b34"/>
    </linearGradient>
    <clipPath id="noms-s3-cover-clip"><rect x="131" y="77" width="254" height="446" rx="17"/></clipPath>
  </defs>
