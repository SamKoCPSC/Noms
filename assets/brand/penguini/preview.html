<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chef Penguini — Noms mascot preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4eee1; color: #352e27; font-family: system-ui, sans-serif; }
  main { max-width: 1000px; margin: auto; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center; }
  h1 { font-size: 32px; letter-spacing: -.04em; }
  p { color: #6d665b; line-height: 1.5; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
  button { padding: 12px 16px; border: 1px solid #c9bca9; border-radius: 12px; background: #f8f2e7; color: #46382c; font: 600 14px system-ui; cursor: pointer; }
  button[aria-pressed="true"] { background: #c96547; color: white; border-color: #b45d41; }
  button:focus-visible { outline: 3px solid #75482e; outline-offset: 3px; }
  button:disabled { opacity: .6; cursor: default; }
  #stage { width: 100%; max-width: 420px; margin: auto; }
  svg { display: block; width: 100%; height: auto; }
  #status { min-height: 24px; }
  @media (max-width: 650px) { main { grid-template-columns: 1fr; } #stage { max-width: 300px; } }
</style>
<main>
  <section>
    <h1>Hello, Chef Penguini.</h1>
    <p>A gentle idle, a little personality, and a smooth return to rest.</p>
    <div class="choices" id="choices" aria-label="Animation selection"></div>
    <button id="pause" type="button" aria-pressed="false" disabled>Pause</button>
    <p id="status">Loading the mascot…</p>
    <p id="availability" hidden></p>
  </section>
  <div id="stage"></div>
</main>
<script src="clips.js"></script>
<script src="player.js"></script>
<script src="thinking-rig.js"></script>
<script>
  (async () => {
    const status = document.querySelector("#status");
    try {
      const response = await fetch("source/rig.svg");
      if (!response.ok) throw new Error("Unable to load the local mascot rig.");
      const parsed = new DOMParser().parseFromString(await response.text(), "image/svg+xml");
      if (parsed.querySelector("parsererror")) throw new Error("Invalid mascot SVG.");
      const svg = document.importNode(parsed.documentElement, true);
      svg.style.visibility = "hidden";
      document.querySelector("#stage").append(svg);
      const renderers = {};
      try {
        renderers.thinking = await PenguiniThinkingRig.create(svg);
      } catch (error) {
        const availability = document.querySelector("#availability");
        availability.hidden = false;
        availability.textContent = "Thinking is unavailable in this browser. The other animations are ready to play.";
        console.warn(error);
      }
      const activities = Object.values(PenguiniClips).filter(clip => clip.id !== "idle" && (!clip.renderer || Object.hasOwn(renderers, clip.renderer)));
      const pause = document.querySelector("#pause");
      const choices = document.querySelector("#choices");
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");
      let player;

      function update() {
        if (!player) return;
        const state = player.state;
        pause.disabled = state.reducedMotion;
        pause.textContent = state.reducedMotion ? "Reduced motion enabled" : state.paused ? "Resume" : "Pause";
        pause.setAttribute("aria-pressed", String(state.paused));
        status.textContent = state.reducedMotion ? "Resting" : state.phase === "idle" ? "A four-second breather…" : PenguiniClips[state.animation].label;
      }

      function select(mode) {
        player?.destroy();
        let cursor = 0;
        const selected = activities.filter(clip => mode === "random" || mode === "all" || clip.id === mode);
        player = new PenguiniPlayer(svg, {
          idle: PenguiniClips.idle,
          animations: selected,
          renderers,
          random: mode === "all" ? () => ((cursor++ % selected.length) + .01) / selected.length : Math.random,
        });
        choices.querySelectorAll("button").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
        if (mode !== "random" && mode !== "all") player.advanceBy(4240);
        update();
      }

      for (const [id, label] of [["random", "Random loop"], ["all", "Play all in order"], ...activities.map(clip => [clip.id, clip.label])]) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.mode = id;
        button.textContent = label;
        button.addEventListener("click", () => select(id));
        choices.append(button);
      }
      svg.addEventListener("mascotphasechange", update);
      pause.addEventListener("click", () => { player.state.paused ? player.play() : player.pause(); update(); });
      reduced.addEventListener("change", update);
      window.addEventListener("pagehide", () => player.pause());
      const requested = new URLSearchParams(location.search).get("animation");
      select(activities.some(clip => clip.id === requested) ? requested : "random");
      svg.style.visibility = "";
    } catch (error) {
      status.setAttribute("role", "alert");
      status.textContent = "Unable to load the preview. Serve this folder over HTTP as described in README.md.";
      console.error(error);
    }
  })();
</script>
</html>
