name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        target: [wasm, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Check WASM client
        if: matrix.target == 'wasm'
        run: cargo check --locked --target wasm32-unknown-unknown

      - name: Check native server
        if: matrix.target == 'server'
        env:
          SQLX_OFFLINE: true
        run: cargo check --locked --no-default-features --features server

  clippy:
    strategy:
      matrix:
        target: [wasm, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Clippy WASM client
        if: matrix.target == 'wasm'
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Clippy native server
        if: matrix.target == 'server'
        env:
          SQLX_OFFLINE: true
        run: cargo clippy --locked --no-default-features --features server -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      # pgtemp starts a disposable PostgreSQL server for each database test.
      # Ubuntu's server binaries live outside the default PATH.
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Verify PostgreSQL test tools
        run: |
          initdb --version
          postgres --version

      - name: Run tests
        env:
          SQLX_OFFLINE: true
        run: cargo test --locked --no-default-features --features server -- --test-threads=8


  # Search tests require the repository's pinned PostgreSQL image because
  # pg_search cannot be installed into the runner's plain PostgreSQL service.
  search-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b

      - name: Cache dependencies
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c

      - name: Install pgschema
        run: |
          go install github.com/pgplex/pgschema@v1.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/pgschema" --help

      - name: Build pinned PostgreSQL image
        run: docker build --tag noms-search-postgres-ci docker/postgres

      - name: Start pinned PostgreSQL image
        run: |
          docker run --detach --name noms-search-postgres-ci \
            --publish 5432:5432 \
            --env POSTGRES_USER=noms_ci \
            --env POSTGRES_PASSWORD=noms_ci_pass \
            --env POSTGRES_DB=noms_search_test \
            noms-search-postgres-ci
          for attempt in {1..60}; do
            if docker exec noms-search-postgres-ci \
              pg_isready --host 127.0.0.1 --username noms_ci --dbname noms_search_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs noms-search-postgres-ci
          exit 1

      - name: Apply extensions and schema
        run: |
          docker exec --interactive noms-search-postgres-ci \
            psql --set ON_ERROR_STOP=1 --username noms_ci --dbname noms_search_test \
            < migrations/extensions.sql
          pgschema apply \
            --host localhost \
            --port 5432 \
            --db noms_search_test \
            --user noms_ci \
            --password noms_ci_pass \
            --plan-host localhost \
            --plan-port 5432 \
            --plan-db noms_search_test \
            --plan-user noms_ci \
            --plan-password noms_ci_pass \
            --file migrations/schema.sql \
            --schema public \
            --auto-approve

      - name: Run ParadeDB search integration tests
        env:
          SEARCH_TEST_DATABASE_URL: postgres://noms_ci:noms_ci_pass@localhost:5432/noms_search_test
          SQLX_OFFLINE: true
        run: cargo test --locked --no-default-features --features server search_integration_ -- --ignored --test-threads=8

      - name: Stop pinned PostgreSQL image
        if: always()
        run: docker rm --force noms-search-postgres-ci || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies for known vulnerabilities
        run: ./scripts/security-audit.sh

      - name: Scan tracked files for credential material
        run: ./scripts/check-tracked-secrets.sh

      - name: Verify pinned deployment artifacts
        run: ./scripts/check-deployment-artifacts.sh

      - name: Verify CI and deployment workflow
        run: bash scripts/tests/test-ci-deployment-workflow.sh

  # Schema drift detection and destructive change blocking.
  # Runs on PRs that modify migrations/schema.sql or migrations/extensions.sql.
  # Uses pgschema to generate a plan against the staging database, then
  # checks the plan for destructive operations (DROP TABLE, DROP COLUMN, etc.)
  # using scripts/check-schema-plan.sh.
  schema-check:
    runs-on: ubuntu-latest
    # Only run on pull requests (not pushes to branches without a PR)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Check if schema files changed
        id: schema-changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}..HEAD" \
             | grep -qE "^migrations/(schema|extensions)\.sql$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pgschema
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          go install github.com/pgplex/pgschema@v1.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/pgschema" --help

      - name: Build extension-capable PostgreSQL image
        if: steps.schema-changed.outputs.changed == 'true'
        run: docker build --tag noms-schema-postgres-ci docker/postgres

      - name: Start extension-capable PostgreSQL image
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          docker run --detach --name noms-schema-postgres-ci \
            --publish 5432:5432 \
            --env POSTGRES_USER=noms_ci \
            --env POSTGRES_PASSWORD=noms_ci_pass \
            --env POSTGRES_DB=noms_ci_test \
            noms-schema-postgres-ci
          for attempt in {1..60}; do
            if docker exec noms-schema-postgres-ci \
              pg_isready --host 127.0.0.1 --username noms_ci --dbname noms_ci_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs noms-schema-postgres-ci
          exit 1

      - name: Apply extensions to test database
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          docker exec --interactive noms-schema-postgres-ci \
            psql --set ON_ERROR_STOP=1 --username noms_ci --dbname noms_ci_test \
            < migrations/extensions.sql

      - name: Generate migration plan
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          pgschema plan \
            --host localhost \
            --port 5432 \
            --db noms_ci_test \
            --user noms_ci \
            --password noms_ci_pass \
            --plan-host localhost \
            --plan-port 5432 \
            --plan-db noms_ci_test \
            --plan-user noms_ci \
            --plan-password noms_ci_pass \
            --schema public \
            --file migrations/schema.sql \
            --output-human stdout \
            --output-json /tmp/migration-plan.json

      - name: Reject destructive changes
        if: steps.schema-changed.outputs.changed == 'true'
        run: bash scripts/check-schema-plan.sh /tmp/migration-plan.json

      - name: Apply and validate schema migrations
        if: steps.schema-changed.outputs.changed == 'true'
        run: |
          pgschema apply \
            --host localhost \
            --port 5432 \
            --db noms_ci_test \
            --user noms_ci \
            --password noms_ci_pass \
            --plan-host localhost \
            --plan-port 5432 \
            --plan-db noms_ci_test \
            --plan-user noms_ci \
            --plan-password noms_ci_pass \
            --schema public \
            --file migrations/schema.sql \
            --auto-approve

      - name: Post migration plan as PR comment
        if: steps.schema-changed.outputs.changed == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          path: /tmp/migration-plan.json

      - name: Stop extension-capable PostgreSQL image
        if: always() && steps.schema-changed.outputs.changed == 'true'
        run: docker rm --force noms-schema-postgres-ci || true
