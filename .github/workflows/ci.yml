name: Database isolation evidence
on:
  push:
    branches: [codex/database-isolation-evidence]
permissions:
  contents: read
concurrency:
  group: noms-database-isolation-evidence
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
jobs:
  reproduce-and-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Install PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          pg_config --bindir >> "$GITHUB_PATH"
      - name: Inventory temporary database construction and exported URIs
        run: |
          git grep -n -E 'pgtemp::|connection_uri\(' -- src
          if git grep -n 'pgtemp::' -- src ':(exclude)src/test_database.rs' ':(exclude)src/lib.rs'; then
            echo "An unconverted raw pgtemp caller remains."
            exit 1
          fi
      - name: Demonstrate the legacy TCP address collision
        run: |
          cargo test --locked --no-default-features --features server --lib legacy_tcp_port_reuse_reaches_the_other_cluster -- --nocapture
      - name: Force port reuse with private socket endpoints
        run: |
          cargo test --locked --no-default-features --features server test_database:: -- --test-threads=8
      - name: Repeat the full parallel suite three times
        run: |
          for attempt in 1 2 3; do
            echo "PARALLEL SUITE RUN $attempt"
            cargo test --locked --no-default-features --features server -- --test-threads=8
          done
